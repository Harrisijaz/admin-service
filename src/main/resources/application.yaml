spring:
  application:
    name: admin-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smartInvoice}?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:rootmysql}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: ${BLOG_MAX_UPLOAD_SIZE:5MB}
      max-request-size: ${BLOG_MAX_UPLOAD_SIZE:5MB}

server:
  port : 9091

admin:
  auth:
    issuer: ${AUTH_ISSUER:smart-invoice-auth}
    jwt-key-id: ${AUTH_JWT_KEY_ID:smart-invoice-auth-key}
    jwks-url: ${ADMIN_JWKS_URL:http://localhost:9090/auth/.well-known/jwks.json}
    jwt-public-key: ${AUTH_JWT_PUBLIC_KEY:}
    jwe-secret: ${AUTH_JWE_SECRET:}
    token-encryption-enabled: ${AUTH_TOKEN_ENCRYPTION_ENABLED:false}
    inactivity-timeout-minutes: ${ADMIN_SESSION_TIMEOUT_MINUTES:20}
  integrations:
    auth-service-base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:9090}
    user-service-base-url: ${USER_SERVICE_BASE_URL:http://localhost:9092}
    payment-service-base-url: ${PAYMENT_SERVICE_BASE_URL:http://localhost:9093}
    ai-service-base-url: ${AI_SERVICE_BASE_URL:http://localhost:9095}
    billing-sync-secret: ${BILLING_SYNC_SECRET:change-me}

blog:
  max-page-size: ${BLOG_MAX_PAGE_SIZE:50}
  max-tags-per-post: ${BLOG_MAX_TAGS_PER_POST:10}
  max-product-links-per-post: ${BLOG_MAX_PRODUCT_LINKS_PER_POST:8}
  cover-image-required-for-publish: ${BLOG_COVER_IMAGE_REQUIRED:false}
  max-upload-bytes: ${BLOG_MAX_UPLOAD_BYTES:5242880}
  media-base-url: ${BLOG_MEDIA_BASE_URL:http://localhost:9091/uploads/blog}
  media-upload-dir: ${BLOG_MEDIA_UPLOAD_DIR:uploads/blog}
  nextjs-revalidation-url: ${NEXTJS_REVALIDATION_URL:}
  nextjs-revalidation-secret: ${NEXTJS_REVALIDATION_SECRET:}
